<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerCrack</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PowerCrack">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/jpeg" href="img.jpg">
<link rel="apple-touch-icon" href="img.jpg">
<script>
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(r => console.log('[PWA] SW registered:', r.scope))
      .catch(e => console.warn('[PWA] SW registration failed:', e));
  });
}
</script>
<style>
  :root{
    --mac-titlebar:rgba(246,246,247,0.94);
    --mac-titlebar-border:rgba(0,0,0,0.12);
    --mac-titlebar-text:#3a3a3c;
    --mac-titlebar-text-dim:#8a8a8e;
    --tl-red:#ff5f57; --tl-red-border:#e0443e;
    --tl-yellow:#febc2e; --tl-yellow-border:#dea123;
    --tl-green:#28c840; --tl-green-border:#1aab29;
    --term-bg:#ffffff;
    --term-bg-soft:#f8f9fa;
    --term-green:#16a34a;
    --term-green-bright:#15803d;
    --term-green-dim:#22c55e;
    --term-green-deep:#166534;
    --term-cyan:#0891b2;
    --term-text:#14532d;
    --term-text-dim:rgba(20,83,45,0.7);
    --term-text-faint:rgba(20,83,45,0.5);
    --term-border:rgba(22,163,74,0.28);
    --term-border-bright:rgba(22,163,74,0.55);
    --mono:ui-monospace,"SF Mono","Menlo","Monaco","Cascadia Code",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:var(--sans);background:#0a0a0a;color:var(--term-text);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;
    padding:70px 20px 40px;position:relative;letter-spacing:-0.01em;
  }
  .splash{
    position:fixed;inset:0;z-index:200;background:#000;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .8s ease, visibility .8s ease;overflow:hidden;cursor:pointer;
  }
  .splash.hide{opacity:0;visibility:hidden;pointer-events:none}
  .splash::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 42%, rgba(220,38,38,0.16) 0%, transparent 55%);
    animation:dangerPulse 2.8s ease-in-out infinite;
  }
  .splash::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(0,0,0,0.85) 78%);
  }
  @keyframes dangerPulse{0%,100%{opacity:0.5}50%{opacity:1}}
  .splash-content{
    position:relative;z-index:2;display:flex;flex-direction:column;
    align-items:center;gap:30px;padding:20px;max-width:680px;width:100%;
  }
  .skull-stage{
    position:relative;width:280px;height:340px;display:grid;place-items:center;
    animation:skullEntrance 1.15s cubic-bezier(.22,1,.36,1) both;
    filter:drop-shadow(0 0 50px rgba(220,38,38,0.5)) drop-shadow(0 0 100px rgba(220,38,38,0.25));
  }
  @keyframes skullEntrance{
    0%{opacity:0;transform:scale(.35) rotate(-22deg) translateY(20px)}
    55%{opacity:1;transform:scale(1.08) rotate(6deg) translateY(-6px)}
    100%{opacity:1;transform:scale(1) rotate(0deg) translateY(0)}
  }
  .skull{
    width:100%;height:100%;
    animation:skullShake .26s ease-in-out 1.15s infinite;
    transform-origin:50% 60%;
  }
  @keyframes skullShake{
    0%,100%{transform:translate(0,0) rotate(0deg)}
    20%{transform:translate(-3px,2px) rotate(-1.4deg)}
    40%{transform:translate(3px,-2px) rotate(1.4deg)}
    60%{transform:translate(-2px,-1px) rotate(-1deg)}
    80%{transform:translate(2px,2px) rotate(1deg)}
  }
  .skull-jaw{
    transform-box:view-box;transform-origin:200px 280px;
    animation:jawLaugh .3s ease-in-out 1.15s infinite;
  }
  @keyframes jawLaugh{
    0%,100%{transform:translateY(0) rotate(0deg)}
    50%{transform:translateY(16px) rotate(2deg)}
  }
  .eye-core{
    transform-box:fill-box;transform-origin:center;
    animation:eyePulse .5s ease-in-out 1.15s infinite;
  }
  @keyframes eyePulse{
    0%,100%{opacity:0.75;transform:scale(1)}
    50%{opacity:1;transform:scale(1.28)}
  }
  .splash-text{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    min-height:150px;width:100%;
  }
  .splash-by{
    font-family:var(--mono);font-size:12px;letter-spacing:6px;
    color:rgba(255,255,255,0.42);text-transform:uppercase;
    min-height:16px;text-align:center;
  }
  .splash-name{
    font-family:var(--mono);font-size:46px;font-weight:800;letter-spacing:8px;
    color:#ffffff;
    text-shadow:0 0 24px rgba(255,255,255,0.5),0 0 50px rgba(220,38,38,0.6),0 0 90px rgba(220,38,38,0.35);
    min-height:56px;line-height:1.1;text-align:center;
  }
  .splash-motto{
    font-family:var(--mono);font-size:13px;letter-spacing:2.5px;
    color:rgba(220,38,38,0.85);text-transform:lowercase;
    min-height:20px;text-align:center;font-style:italic;
    text-shadow:0 0 16px rgba(220,38,38,0.6);
  }
  .splash-by.typing::after,
  .splash-name.typing::after,
  .splash-motto.typing::after{
    content:"▊";animation:cursorBlink .7s step-end infinite;
    margin-left:3px;color:inherit;opacity:0.8;
  }
  @keyframes cursorBlink{0%,50%{opacity:1}51%,100%{opacity:0}}
  .splash-skip{
    position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:10.5px;letter-spacing:3px;
    color:rgba(255,255,255,0.32);text-transform:uppercase;
    animation:skipBlink 1.8s ease-in-out infinite;pointer-events:none;
  }
  @keyframes skipBlink{0%,100%{opacity:0.28}50%{opacity:0.7}}
  .mac-menu{
    position:fixed;top:0;left:0;right:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:6px 18px;font-family:var(--sans);font-size:12.5px;font-weight:500;
    color:rgba(255,255,255,0.9);background:rgba(0,0,0,0.7);
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .mac-menu .left,.mac-menu .right{display:flex;align-items:center;gap:16px}
  .mac-menu .apple{color:rgba(255,255,255,0.92);font-size:14px;margin-right:2px}
  .mac-menu .item{color:rgba(255,255,255,0.82);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .mac-menu .bold{font-weight:600;color:#fff}
  .mac-menu .green-dot{
    width:7px;height:7px;border-radius:50%;background:var(--term-green-dim);
    box-shadow:0 0 8px var(--term-green-dim);animation:blinkDot 2s ease-in-out infinite;
  }
  @keyframes blinkDot{0%,100%{opacity:1}50%{opacity:0.4}}
  .progress-bar{
    position:fixed;top:30px;left:0;right:0;height:2px;
    background:rgba(255,255,255,0.05);z-index:59;
  }
  .progress-bar .fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--term-green-deep),var(--term-green),var(--term-green-dim));
    transition:width .5s cubic-bezier(.25,1,.4,1);
  }
  .stage{
    position:relative;z-index:10;flex:1;display:flex;flex-direction:column;
    width:100%;max-width:820px;margin:0 auto;min-height:calc(100vh - 130px);
  }
  .card-container{
    flex:1;display:grid;min-height:640px;position:relative;
    filter:drop-shadow(0 30px 60px rgba(0,0,0,0.6));
  }
  .card{
    grid-area:1/1;display:flex;flex-direction:column;background:#f6f6f7;
    border-radius:11px;overflow:hidden;position:relative;
    box-shadow:
      0 0 0 0.5px rgba(0,0,0,0.28),0 0 0 1px rgba(0,0,0,0.06),
      0 30px 70px rgba(0,0,0,0.65),0 12px 30px rgba(0,0,0,0.4);
    max-height:100%;
  }
  .titlebar{
    display:flex;align-items:center;padding:0 14px;height:38px;
    background:linear-gradient(180deg,#fbfbfc 0%,#f0f0f2 100%);
    border-bottom:1px solid var(--mac-titlebar-border);
    flex:0 0 auto;position:relative;user-select:none;
  }
  .traffic-lights{display:flex;align-items:center;gap:8px;flex:0 0 auto;height:100%}
  .tl{
    width:12px;height:12px;border-radius:50%;border:none;padding:0;cursor:pointer;
    display:grid;place-items:center;transition:filter .15s;position:relative;
    font-family:var(--sans);font-size:8px;font-weight:900;color:rgba(0,0,0,0.55);
    line-height:1;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.16);
  }
  .tl-red{background:var(--tl-red);box-shadow:inset 0 0 0 0.5px var(--tl-red-border)}
  .tl-yellow{background:var(--tl-yellow);box-shadow:inset 0 0 0 0.5px var(--tl-yellow-border)}
  .tl-green{background:var(--tl-green);box-shadow:inset 0 0 0 0.5px var(--tl-green-border)}
  .tl:hover{filter:brightness(1.05)}
  .traffic-lights:hover .tl-red::before{content:"×"}
  .traffic-lights:hover .tl-yellow::before{content:"−"}
  .traffic-lights:hover .tl-green::before{content:"+"}
  .tl::before{display:block;transform:translateY(-0.3px);line-height:1}
  .titlebar-title{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-family:var(--sans);font-size:13px;font-weight:500;color:var(--mac-titlebar-text);
    display:flex;align-items:center;gap:6px;pointer-events:none;
    max-width:60%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  }
  .titlebar-title i{font-size:11px;color:var(--mac-titlebar-text-dim)}
  .titlebar-title .path{color:var(--mac-titlebar-text-dim)}
  .titlebar-title .path b{color:var(--mac-titlebar-text);font-weight:600}
  .titlebar-share{
    display:flex;gap:8px;flex:0 0 auto;width:60px;justify-content:flex-end;
    color:var(--mac-titlebar-text-dim);font-size:12px;
  }
  .terminal-content{
    flex:1;background:var(--term-bg);overflow-y:auto;
    padding:34px 38px 26px;display:flex;flex-direction:column;
    color:var(--term-text);font-family:var(--mono);position:relative;
  }
  .terminal-content::-webkit-scrollbar{width:8px}
  .terminal-content::-webkit-scrollbar-thumb{background:rgba(22,163,74,0.28);border-radius:4px}
  .terminal-content::-webkit-scrollbar-track{background:transparent}
  .terminal-content > *{animation:revealUp .4s cubic-bezier(.22,1,.36,1) backwards}
  .terminal-content > *:nth-child(1){animation-delay:.02s}
  .terminal-content > *:nth-child(2){animation-delay:.05s}
  .terminal-content > *:nth-child(3){animation-delay:.08s}
  .terminal-content > *:nth-child(4){animation-delay:.11s}
  .terminal-content > *:nth-child(5){animation-delay:.14s}
  .terminal-content > *:nth-child(6){animation-delay:.17s}
  .terminal-content > *:nth-child(7){animation-delay:.20s}
  @keyframes revealUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .prompt-line{
    font-family:var(--mono);font-size:11px;color:var(--term-text-faint);
    margin-bottom:22px;display:flex;align-items:center;gap:8px;
    letter-spacing:0.4px;flex-wrap:wrap;
  }
  .prompt-line .user{color:var(--term-green-bright);font-weight:600}
  .prompt-line .host{color:var(--term-cyan);font-weight:600}
  .prompt-line .path{color:var(--term-green)}
  .prompt-line .dollar{color:var(--term-text-faint)}
  .prompt-line .cmd{color:var(--term-text)}
  .chapter-tag{
    display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
    font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:1.8px;
    text-transform:uppercase;color:var(--term-green-bright);
    background:rgba(22,163,74,0.08);padding:5px 11px;border-radius:4px;
    border:1px solid var(--term-border);margin-bottom:18px;
  }
  .chapter-tag i{font-size:9px}
  .card-icon-wrap{display:flex;justify-content:center;margin-bottom:22px}
  .card-icon{
    width:76px;height:76px;border-radius:16px;display:grid;place-items:center;
    font-size:28px;color:#ffffff;
    background:linear-gradient(135deg,var(--term-green-dim),var(--term-cyan));
    box-shadow:0 12px 28px rgba(22,163,74,0.3),inset 0 1px 0 rgba(255,255,255,0.4);
    animation:iconFloat 4.5s ease-in-out infinite;position:relative;
  }
  .card-icon::after{
    content:"";position:absolute;inset:-7px;border-radius:20px;
    border:1px solid rgba(22,163,74,0.28);animation:iconRing 4.5s ease-in-out infinite;
  }
  @keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes iconRing{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.06);opacity:1}}
  .card-title{
    font-family:var(--mono);font-size:22px;letter-spacing:-0.01em;font-weight:700;
    text-align:center;margin:0 0 12px;line-height:1.3;color:var(--term-green-bright);
  }
  .card-title::before{content:"# ";color:rgba(22,163,74,0.4);font-weight:500}
  .card-title::after{
    content:"_";color:var(--term-green-bright);
    animation:cursorBlink 1.1s step-end infinite;margin-left:3px;font-weight:400;
  }
  .card-desc{
    font-family:var(--mono);font-size:13px;line-height:1.75;color:var(--term-text-dim);
    text-align:center;margin:0 auto 26px;max-width:520px;font-weight:400;
    min-height:50px;white-space:pre-wrap;word-wrap:break-word;letter-spacing:0.1px;
  }
  .card-desc.typing::after{
    content:"▊";color:var(--term-green-bright);
    animation:cursorBlink .9s step-end infinite;margin-left:2px;
  }
  .card-body{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    gap:14px;margin-bottom:10px;
  }
  .toggle-wrap{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px 0}
  .toggle-label{
    font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:1.6px;
    text-transform:uppercase;color:var(--term-text-faint);transition:.3s;
    width:70px;text-align:center;
  }
  .toggle-wrap.on .toggle-label.on,
  .toggle-wrap.off .toggle-label.off{color:var(--term-green-bright)}
  .big-switch{
    appearance:none;-webkit-appearance:none;width:96px;height:50px;border-radius:25px;
    flex:0 0 auto;background:rgba(22,163,74,0.08);border:1px solid var(--term-border);
    position:relative;cursor:pointer;outline:none;transition:.3s;
  }
  .big-switch::after{
    content:"";position:absolute;top:4px;left:4px;width:40px;height:40px;border-radius:50%;
    background:#ffffff;border:2px solid var(--term-green);
    box-shadow:0 2px 6px rgba(20,83,45,0.2);transition:.3s cubic-bezier(.4,1.4,.6,1);
  }
  .big-switch:checked{background:rgba(22,163,74,0.18);border-color:var(--term-green-dim)}
  .big-switch:checked::after{transform:translateX(46px);border-color:var(--term-green-dim)}
  .stepper{
    display:flex;align-items:center;justify-content:center;
    background:rgba(22,163,74,0.05);border:1px solid var(--term-border);
    border-radius:12px;padding:7px;gap:6px;max-width:320px;margin:0 auto;
  }
  .step-btn{
    width:50px;height:50px;border-radius:8px;border:none;
    background:rgba(22,163,74,0.08);color:var(--term-green-bright);
    font-size:14px;cursor:pointer;transition:.2s;display:grid;place-items:center;
  }
  .step-btn:hover{background:rgba(22,163,74,0.2);color:#ffffff}
  .step-btn:active{transform:scale(.95)}
  .step-input{
    width:110px;text-align:center;background:transparent;border:none;
    color:var(--term-green-bright);font-family:var(--mono);
    font-size:26px;font-weight:700;outline:none;
    appearance:textfield;-moz-appearance:textfield;letter-spacing:-0.02em;
  }
  .step-input::-webkit-outer-spin-button,
  .step-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .custom-select{position:relative;width:100%}
  .cs-trigger{
    width:100%;padding:14px 42px 14px 16px;background:rgba(22,163,74,0.05);
    border:1px solid var(--term-border);border-radius:10px;
    color:var(--term-green-bright);font-family:var(--mono);font-size:13px;font-weight:500;
    letter-spacing:0.3px;outline:none;cursor:pointer;transition:.2s;
    display:flex;align-items:center;justify-content:space-between;text-align:left;
  }
  .cs-trigger:hover{background:rgba(22,163,74,0.1)}
  .cs-trigger .cs-value{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cs-trigger .cs-chevron{
    color:var(--term-green-bright);font-size:11px;
    transition:transform .25s cubic-bezier(.22,1,.36,1);flex:0 0 auto;
  }
  .custom-select.open .cs-chevron{transform:rotate(180deg)}
  .custom-select.open .cs-trigger{
    border-color:var(--term-green-dim);box-shadow:0 0 0 3px rgba(22,163,74,0.15);
  }
  .cs-menu{
    position:absolute;top:calc(100% + 5px);left:0;right:0;background:#ffffff;
    border:1px solid var(--term-border-bright);border-radius:10px;padding:5px;
    z-index:100;opacity:0;visibility:hidden;transform:translateY(-5px) scale(.98);
    transform-origin:top center;
    transition:opacity .18s, transform .2s cubic-bezier(.22,1,.36,1), visibility .18s;
    box-shadow:0 18px 40px rgba(20,83,45,0.18), 0 2px 8px rgba(20,83,45,0.08);
    max-height:280px;overflow-y:auto;
  }
  .cs-menu::-webkit-scrollbar{width:5px}
  .cs-menu::-webkit-scrollbar-thumb{background:rgba(22,163,74,0.3);border-radius:5px}
  .custom-select.open .cs-menu{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
  .cs-option{
    padding:10px 12px 10px 30px;border-radius:7px;font-family:var(--mono);
    font-size:12.5px;color:var(--term-green-bright);cursor:pointer;transition:.12s;
    position:relative;user-select:none;letter-spacing:0.3px;
  }
  .cs-option::before{
    content:"";position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:7px;height:7px;border-radius:50%;border:1px solid rgba(22,163,74,0.5);transition:.15s;
  }
  .cs-option:hover{background:rgba(22,163,74,0.12);color:var(--term-green-deep)}
  .cs-option.selected{background:rgba(22,163,74,0.16);color:var(--term-green-deep);font-weight:600}
  .cs-option.selected::before{
    background:var(--term-green-dim);box-shadow:0 0 6px rgba(22,163,74,0.6);
    border-color:var(--term-green-dim);
  }
  .nice-input{
    width:100%;padding:14px 16px;background:rgba(22,163,74,0.04);
    border:1px solid var(--term-border);border-radius:10px;
    color:var(--term-green-bright);font-family:var(--mono);font-size:13.5px;
    letter-spacing:0.3px;outline:none;transition:.2s;
  }
  .nice-input::placeholder{color:rgba(22,163,74,0.4);font-family:var(--mono)}
  .nice-input:focus{
    border-color:var(--term-green-dim);box-shadow:0 0 0 3px rgba(22,163,74,0.14);background:#ffffff;
  }
  .input-hint{
    font-family:var(--mono);font-size:10.5px;color:var(--term-text-faint);
    margin-top:8px;text-align:center;line-height:1.7;letter-spacing:0.5px;
  }
  .input-hint code{
    font-family:var(--mono);font-size:10.5px;background:rgba(22,163,74,0.12);
    padding:2px 5px;border-radius:3px;color:var(--term-green-deep);
    border:1px solid rgba(22,163,74,0.18);
  }
  .conditional-reveal{
    animation:revealFade .3s cubic-bezier(.22,1,.36,1);
    overflow:hidden;margin-top:10px;
  }
  @keyframes revealFade{
    from{opacity:0;max-height:0;transform:translateY(-4px)}
    to{opacity:1;max-height:200px;transform:translateY(0)}
  }
  .hotkey-btn{
    display:flex;align-items:center;justify-content:center;gap:11px;
    padding:22px 24px;border-radius:12px;cursor:pointer;
    background:rgba(22,163,74,0.05);border:1px solid var(--term-border);
    font-family:var(--mono);font-size:13.5px;font-weight:600;letter-spacing:1px;
    transition:.2s;outline:none;color:var(--term-green-bright);min-height:72px;
  }
  .hotkey-btn:hover{background:rgba(22,163,74,0.1)}

(function clock(){

})();

/* =========================================================
   v9 character sets — braces removed from specials pool.
   buildCharset additionally filters them defensively so
   they can never reach the escape regex or SendKeys.
   ========================================================= */
const SETS = {
  lower:    'abcdefghijklmnopqrstuvwxyz',
  upper:    'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  digits:   '0123456789',
  specials: '!@#$%^&*()-_=+[];:,.?/|~<>'
};

const state = {
  lower: true, upper: true, digits: true, specials: false, custom: '',
  minLen: 6, maxLen: 10,
  spaceMode: 'none', spaceCount: 1, spaceEvery: 3, customSpaces: '2,5,8',
  prefix: '', suffix: '',
  hkStart: { ctrl:true, shift:true, alt:false, win:false, code:'Digit1' },
  hkStop:  { ctrl:true, shift:true, alt:false, win:false, code:'Digit2' },
  delayType: 200, delayKey: 90,
  pressEnter: true, clearMode: 'selectall',
  dedupe: true, minimize: true, beep: false,
  maxAttempts: 0, logFile: ''
};

const ACTIVATION =
  "Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy Bypass -Force; " +
  "Write-Host '[ACTIVATED] Execution policy set to Bypass for the current user. This persists.' -ForegroundColor Green";

function psQuote(str){ return String(str).replace(/'/g, "''"); }
function sanitize(str){ return String(str).replace(/[\x00-\x1F\x7F]/g, ''); }
function escapeHtml(str){
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function parseCustomPositions(str){
  return sanitize(str).split(',').map(s => parseInt(s.trim(), 10))
    .filter(n => Number.isFinite(n) && n >= 0 && n <= 64);
}

/* v9: filter { and } defensively — they cannot appear in charset */
function buildCharset(){
  const out = [], seen = new Set();
  const push = s => {
    for (const ch of s){
      if (ch === '{' || ch === '}') continue;
      if (!seen.has(ch)){ seen.add(ch); out.push(ch); }
    }
  };
  if (state.lower)    push(SETS.lower);
  if (state.upper)    push(SETS.upper);
  if (state.digits)   push(SETS.digits);
  if (state.specials) push(SETS.specials);
  if (state.custom)   push(sanitize(state.custom));
  if (!out.length)    push('a');
  return out.join('');
}

const VK_MAP = {
  Space:0x20, Enter:0x0D, Escape:0x1B, Tab:0x09, Backspace:0x08, Delete:0x2E,
  Insert:0x2D, Home:0x24, End:0x23, PageUp:0x21, PageDown:0x22,
  ArrowUp:0x26, ArrowDown:0x28, ArrowLeft:0x25, ArrowRight:0x27,
  Minus:0xBD, Equal:0xBB, BracketLeft:0xDB, BracketRight:0xDD, Backslash:0xDC,
  Semicolon:0xBA, Quote:0xDE, Comma:0xBC, Period:0xBE, Slash:0xBF, Backquote:0xC0
};
function vkCode(code){
  if (/^Digit[0-9]$/.test(code))       return 0x30 + parseInt(code.slice(5), 10);
  if (/^Key[A-Z]$/.test(code))         return code.charCodeAt(3);
  if (/^F([1-9]|1[0-2])$/.test(code))  return 0x70 + (parseInt(code.slice(1), 10) - 1);
  if (/^Numpad[0-9]$/.test(code))      return 0x60 + parseInt(code.slice(6), 10);
  return VK_MAP[code] || 0;
}
function keyName(code){
  if (/^Key[A-Z]$/.test(code))         return code.slice(3);
  if (/^Digit[0-9]$/.test(code))       return code.slice(5);
  if (/^Numpad/.test(code))            return 'Num ' + code.slice(6);
  if (/^F([1-9]|1[0-2])$/.test(code))  return code;
  return code;
}
function hkLabel(hk){
  const p = [];
  if (hk.ctrl)  p.push('Ctrl');
  if (hk.shift) p.push('Shift');
  if (hk.alt)   p.push('Alt');
  if (hk.win)   p.push('Win');
  p.push(keyName(hk.code));
  return p.join(' + ');
}
function hkCond(hk){
  const parts = [];
  parts.push(hk.ctrl  ? '(Kd 0x11)' : '(-not (Kd 0x11))');
  parts.push(hk.shift ? '(Kd 0x10)' : '(-not (Kd 0x10))');
  parts.push(hk.alt   ? '(Kd 0x12)' : '(-not (Kd 0x12))');
  const vk = vkCode(hk.code);
  parts.push('(Kd 0x' + vk.toString(16).toUpperCase() + ')');
  return parts.join(' -and ');
}

/* =========================================================
   POWERSHELL SCRIPT BUILDER — v9

   v9 fixes:
   1. Relative/empty-parent log path crash: uses .NET Path /
      Directory APIs exclusively (no Split-Path), returns $null
      predictably, null-guarded before every CreateDirectory call.
   2. Brace over-escape: charset filter prevents { and } from ever
      entering the pipeline (defensive even if custom field is used).
   3. Physical modifier collision: checks Kd 0x10/0x11/0x12 at top
      of every attempt; pauses 250ms and retries if any held.
   ========================================================= */
function buildScript(){
  const charset   = psQuote(buildCharset());
  const minL      = Math.max(1, parseInt(state.minLen, 10) || 1);
  const maxL      = Math.max(minL, parseInt(state.maxLen, 10) || minL);
  const d1        = Math.max(0, parseInt(state.delayType, 10) || 0);
  const d2        = Math.max(0, parseInt(state.delayKey, 10) || 0);
  const startCond = hkCond(state.hkStart);
  const stopCond  = hkCond(state.hkStop);
  const startLbl  = hkLabel(state.hkStart).replace(/'/g, '');
  const stopLbl   = hkLabel(state.hkStop).replace(/'/g, '');
  const logFileRaw = state.logFile ? psQuote(sanitize(state.logFile)) : '';

  const b = [];

  /* v9 FIX #3: physical modifier guard. If user physically holds
     Shift/Ctrl/Alt, SendKeys merges them with injected keys and
     corrupts output. Pause and retry. Runs BEFORE the attempt body
     but AFTER start/stop detection in the outer loop. */
  b.push("if((Kd 0x10) -or (Kd 0x11) -or (Kd 0x12)){Write-Host '[MODKEY] Modifier held — pausing' -ForegroundColor DarkYellow;Start-Sleep -Milliseconds 250;continue}");

  b.push('$len=$r.Next($min,$max+1)');
  b.push("$s=''");
  b.push('for($i=0;$i -lt $len;$i++){$s+=$chars[$r.Next($chars.Length)]}');

  if (state.spaceMode === 'random' && state.spaceCount > 0){
    b.push('for($j=0;$j -lt ' + state.spaceCount + ';$j++){$s=$s.Insert($r.Next(0,$s.Length+1),\' \')}');
  } else if (state.spaceMode === 'pattern' && state.spaceEvery > 0){
    b.push("$t=''");
    b.push('for($i=0;$i -lt $s.Length;$i++){$t+=$s[$i];if((($i+1)%' + state.spaceEvery + ') -eq 0){$t+=\' \'}}');
    b.push('$s=$t');
  } else if (state.spaceMode === 'leading'){
    b.push("$s=' '+$s");
  } else if (state.spaceMode === 'trailing'){
    b.push("$s=$s+' '");
  } else if (state.spaceMode === 'both'){
    b.push("$s=' '+$s+' '");
  } else if (state.spaceMode === 'custom'){
    const positions = parseCustomPositions(state.customSpaces);
    if (positions.length > 0){
      const sortedDesc = positions.slice().sort((a,b) => b - a);
      b.push('$cp=@(' + sortedDesc.join(',') + ')');
      b.push('foreach($p in $cp){if($p -le $s.Length){$s=$s.Insert($p,\' \')}}');
    }
  }

  if (state.prefix) b.push("$s='" + psQuote(sanitize(state.prefix)) + "'+$s");
  if (state.suffix) b.push("$s=$s+'" + psQuote(sanitize(state.suffix)) + "'");

  if (state.dedupe){
    b.push("if($seen.Contains($s)){$dup++;Write-Host ('[DUP  ] '+$s) -ForegroundColor DarkGray;Write-PCLog ('[DUP  ] '+$s);Start-Sleep -Milliseconds 5;continue}");
    b.push('[void]$seen.Add($s)');
  }

  b.push('$n++');
  b.push("Write-Host ('[TRY '+$n+'] '+$s) -ForegroundColor Yellow");
  b.push("Write-PCLog ('[TRY '+$n+'] '+$s)");

  /* v9 FIX #2: braces cannot reach this regex because charset is
     filtered. The character class is unchanged for the remaining
     reserves. Escaping { and } never happens because they never
     appear in $s. */
  b.push("$e=$s -replace '([+^%~(){}])','{$1}'");

  b.push("try{[System.Windows.Forms.SendKeys]::SendWait($e)}catch{$err++;Write-Host '[NOFIELD] SendKeys failed — is a text field focused?' -ForegroundColor DarkRed;Write-PCLog ('[NOFIELD] '+$_.Exception.Message)}");
  b.push('Start-Sleep -Milliseconds $d1');

  if (state.pressEnter){
    b.push("try{[System.Windows.Forms.SendKeys]::SendWait('{ENTER}')}catch{}");
    b.push('Start-Sleep -Milliseconds $d2');
  }
  if (state.clearMode === 'selectall'){
    b.push("try{[System.Windows.Forms.SendKeys]::SendWait('^a')}catch{};try{[System.Windows.Forms.SendKeys]::SendWait('{BACKSPACE}')}catch{}");
  } else if (state.clearMode === 'backspace'){
    b.push("for($q=0;$q -lt $s.Length;$q++){try{[System.Windows.Forms.SendKeys]::SendWait('{BACKSPACE}')}catch{}}");
  }
  if (state.maxAttempts > 0){
    b.push("if($n -ge " + state.maxAttempts + "){$run=$false;Write-Host ('[LIMIT] Attempt limit reached: '+$n) -ForegroundColor Magenta;Write-PCLog ('[LIMIT] '+$n)}");
  }

  const s = [];
  s.push("$ErrorActionPreference='Continue'");

  s.push("Write-Host ''");
  s.push("Write-Host '+-------------------------------------------------+' -ForegroundColor DarkGreen");
  s.push("Write-Host '|  PowerCrack - Payload Injector v9               |' -ForegroundColor Green");
  s.push("Write-Host '|  For authorized penetration testing only.       |' -ForegroundColor DarkGreen");
  s.push("Write-Host '+-------------------------------------------------+' -ForegroundColor DarkGreen");
  s.push("Write-Host ''");

  s.push("Write-Host '[INIT ] Loading System.Windows.Forms...' -ForegroundColor DarkCyan");
  s.push("try{Add-Type -AssemblyName System.Windows.Forms -ErrorAction Stop}catch{Write-Host '[FATAL] System.Windows.Forms unavailable. Requires Windows PowerShell 5.1+ on Windows.' -ForegroundColor Red;exit 1}");

  s.push("Write-Host '[INIT ] Registering user32 P/Invoke helper...' -ForegroundColor DarkCyan");
  s.push("if(-not ('GK' -as [type])){try{Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;public class GK{[DllImport(\"user32.dll\")]public static extern short GetAsyncKeyState(int v);[DllImport(\"user32.dll\")]public static extern bool ShowWindow(IntPtr h,int c);}' -ErrorAction Stop}catch{}}");
  s.push("if(-not ('GK' -as [type])){Write-Host '[FATAL] GK helper type failed to load.' -ForegroundColor Red;exit 1}");

  s.push("function Kd([int]$v){return (([int][GK]::GetAsyncKeyState($v) -band 0x8000) -ne 0)}");

  s.push("function BS(){try{[System.Media.SystemSounds]::Asterisk.Play();return}catch{};try{[console]::beep(1000,150);return}catch{};try{[console]::beep()}catch{}}");
  s.push("function BE(){try{[System.Media.SystemSounds]::Hand.Play();return}catch{};try{[console]::beep(400,200);return}catch{};try{[console]::beep()}catch{}}");

  /* v9 FIX #1: .NET path APIs, predictable $null return, null-guarded */
  s.push("$script:logPath=''");
  s.push("$script:maxLogBytes=10485760");
  s.push("$script:rotationEnabled=$true");
  s.push("function Write-PCLog([string]$msg){if([string]::IsNullOrWhiteSpace($script:logPath)){return};try{$lp=$script:logPath;$ld=[System.IO.Path]::GetDirectoryName($lp);if(-not [string]::IsNullOrWhiteSpace($ld) -and -not [System.IO.Directory]::Exists($ld)){[void][System.IO.Directory]::CreateDirectory($ld)};if($script:rotationEnabled -and [System.IO.File]::Exists($lp)){try{$fi=New-Object System.IO.FileInfo($lp);if($fi.Length -gt $script:maxLogBytes){$bak=$lp+'.1';if([System.IO.File]::Exists($bak)){[System.IO.File]::Delete($bak)};[System.IO.File]::Move($lp,$bak)}}catch{$script:rotationEnabled=$false;Write-Host ('[LOG-ROTATE] Disabled: '+$_.Exception.Message) -ForegroundColor DarkYellow}};[System.IO.File]::AppendAllText($lp,('['+(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')+'] '+$msg+[Environment]::NewLine))}catch{$script:logPath='';Write-Host ('[LOG-ERROR] Logging disabled: '+$_.Exception.Message) -ForegroundColor DarkRed}}");

  if (logFileRaw){
    s.push("try{$lp='" + logFileRaw + "';if(-not [System.IO.Path]::IsPathRooted($lp)){$lp=[System.IO.Path]::GetFullPath((Join-Path -Path (Get-Location).Path -ChildPath $lp))};$ld=[System.IO.Path]::GetDirectoryName($lp);if(-not [string]::IsNullOrWhiteSpace($ld) -and -not [System.IO.Directory]::Exists($ld)){[void][System.IO.Directory]::CreateDirectory($ld)};$script:logPath=$lp;[System.IO.File]::AppendAllText($lp,('=== PowerCrack session started '+(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')+' ==='+[Environment]::NewLine));Write-Host ('[LOG  ] Session log: '+$script:logPath) -ForegroundColor DarkCyan}catch{Write-Host ('[LOG-ERROR] Could not open log file: '+$_.Exception.Message) -ForegroundColor DarkRed;$script:logPath=''}}");
  } else {
    s.push("$script:logPath=''");
  }

  s.push("$chars='" + charset + "'");
  s.push('$min=' + minL + ';$max=' + maxL);
  s.push('$d1=' + d1 + ';$d2=' + d2);
  s.push('$run=$false;$n=0;$dup=0;$err=0');
  s.push('$r=New-Object System.Random');
  if (state.dedupe){
    s.push("$seen=New-Object 'System.Collections.Generic.HashSet[string]'");
  }

  s.push("Write-Host ''");
  s.push("Write-Host ('[READY] Armed. '+'" + startLbl + "'+' = START | '+'" + stopLbl + "'+' = STOP') -ForegroundColor Cyan");
  s.push("Write-Host '[WARN ] SendKeys sends to the FOCUSED window only.' -ForegroundColor DarkYellow");
  s.push("Write-Host '[WARN ] Click the target input field BEFORE arming the injector.' -ForegroundColor DarkYellow");
  s.push("Write-Host '[WARN ] Release Shift / Ctrl / Alt when arming — held modifiers corrupt injected keys.' -ForegroundColor DarkYellow");
  s.push("Write-Host ''");

  if (state.minimize){
    s.push("try{Write-Host '[TARGET] Minimizing console in 3 seconds — click your target field now.' -ForegroundColor Yellow;Start-Sleep -Milliseconds 1200;Write-Host '[TARGET] 2...' -ForegroundColor Yellow;Start-Sleep -Milliseconds 1000;Write-Host '[TARGET] 1...' -ForegroundColor Yellow;Start-Sleep -Milliseconds 1000;$proc=Get-Process -Id $PID;$hwnd=$proc.MainWindowHandle;if($hwnd -ne [IntPtr]::Zero){[void][GK]::ShowWindow($hwnd,6)};Write-Host '[TARGET] Console minimized. Awaiting hotkey.' -ForegroundColor DarkCyan}catch{}");
  }

  const beepStart = state.beep ? 'BS;' : '';
  const beepStop  = state.beep ? 'BE;' : '';

  const loop =
    'while($true){' +
      'if(' + startCond + '){if(-not $run){$run=$true;$n=0;$dup=0;$err=0;Write-Host \'\';Write-Host \'[STARTED] Injector armed. Awaiting target focus...\' -ForegroundColor Green;Write-PCLog \'--- START ---\';' + beepStart + '};Start-Sleep -Milliseconds 420};' +
      'if(' + stopCond  + '){if($run){$run=$false;Write-Host \'\';Write-Host (\'[STOPPED] Injector disarmed. Attempts: \'+$n+\' | Dupes: \'+$dup+\' | Errors: \'+$err) -ForegroundColor Red;Write-PCLog (\'--- STOP  --- attempts=\'+$n+\' dupes=\'+$dup+\' errors=\'+$err);' + beepStop + '};Start-Sleep -Milliseconds 420};' +
      'if($run){' + b.join(';') + '};' +
      'Start-Sleep -Milliseconds 25' +
    '}';

  s.push(loop);
  return s.join(';');
}

function generateSample(){
  const pool = buildCharset();
  const minL = Math.max(1, parseInt(state.minLen, 10) || 1);
  const maxL = Math.max(minL, parseInt(state.maxLen, 10) || minL);
  const len  = minL + Math.floor(Math.random() * (maxL - minL + 1));
  let s = '';
  for (let i = 0; i < len; i++) s += pool[Math.floor(Math.random() * pool.length)];
  if (state.spaceMode === 'random' && state.spaceCount > 0){
    for (let j = 0; j < state.spaceCount; j++){
      const pos = Math.floor(Math.random() * (s.length + 1));
      s = s.slice(0, pos) + ' ' + s.slice(pos);
    }
  } else if (state.spaceMode === 'pattern' && state.spaceEvery > 0){
    let t = '';
    for (let i = 0; i < s.length; i++){
      t += s[i];
      if ((i + 1) % state.spaceEvery === 0) t += ' ';
    }
    s = t;
  } else if (state.spaceMode === 'leading'){ s = ' ' + s; }
  else if (state.spaceMode === 'trailing'){ s = s + ' '; }
  else if (state.spaceMode === 'both'){ s = ' ' + s + ' '; }
  else if (state.spaceMode === 'custom'){
    const positions = parseCustomPositions(state.customSpaces);
    const sortedDesc = positions.slice().sort((a,b) => b - a);
    for (const p of sortedDesc){ if (p <= s.length) s = s.slice(0, p) + ' ' + s.slice(p); }
  }
  return sanitize(state.prefix || '') + s + sanitize(state.suffix || '');
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function bump(el){
  el.style.transition = 'transform .16s ease, color .16s ease';
  el.style.transform = 'scale(1.1)';
  el.style.color = '#16a34a';
  setTimeout(() => { el.style.transform = 'scale(1)'; el.style.color = ''; }, 160);
}

function buildCustomSelect(options, currentValue, onChange){
  const wrap = el('div', 'custom-select');
  const trigger = document.createElement('button');
  trigger.type = 'button'; trigger.className = 'cs-trigger';
  const valueSpan = el('span', 'cs-value');
  const chevron = el('i', 'cs-chevron fa-solid fa-chevron-down');
  trigger.appendChild(valueSpan); trigger.appendChild(chevron);
  const menu = el('div', 'cs-menu');
  function setValue(val){
    const opt = options.find(o => o.value === val);
    valueSpan.textContent = opt ? opt.label : '';
    menu.querySelectorAll('.cs-option').forEach(o => {
      o.classList.toggle('selected', o.dataset.value === val);
    });
  }
  setValue(currentValue);
  options.forEach(opt => {
    const item = el('div', 'cs-option', opt.label);
    item.dataset.value = opt.value;
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      setValue(opt.value);
      wrap.classList.remove('open');
      onChange(opt.value);
    });
    menu.appendChild(item);
  });
  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.custom-select.open').forEach(s => {
      if (s !== wrap) s.classList.remove('open');
    });
    wrap.classList.toggle('open');
  });
  wrap.appendChild(trigger); wrap.appendChild(menu);
  return wrap;
}
document.addEventListener('click', () => {
  document.querySelectorAll('.custom-select.open').forEach(s => s.classList.remove('open'));
});

let activeTypeTimer = null;
function typeInto(el, text, speed){
  if (activeTypeTimer){ clearInterval(activeTypeTimer); activeTypeTimer = null; }
  el.textContent = ''; el.classList.add('typing');
  let i = 0;
  const timer = setInterval(() => {
    if (i >= text.length){
      clearInterval(timer); el.classList.remove('typing');
      if (activeTypeTimer === timer) activeTypeTimer = null;
      return;
    }
    el.textContent += text[i++];
  }, speed);
  activeTypeTimer = timer;
}

    const minusBtn = el('button', 'step-btn', '<i class="fa-solid fa-minus"></i>');
    const input = document.createElement('input');
    input.type = 'number'; input.className = 'step-input';
    input.min = def.min; input.max = def.max;
    input.step = def.step || 1; input.value = state[def.key];
    const plusBtn = el('button', 'step-btn', '<i class="fa-solid fa-plus"></i>');
    const clamp = v => Math.max(def.min, Math.min(def.max, v));
    minusBtn.addEventListener('click', () => {
      const v = clamp((parseInt(input.value, 10) || 0) - (def.step || 1));
      input.value = v; state[def.key] = v; bump(input);
    });
    plusBtn.addEventListener('click', () => {
      const v = clamp((parseInt(input.value, 10) || 0) + (def.step || 1));
      input.value = v; state[def.key] = v; bump(input);
    });
    input.addEventListener('input', () => {
      const v = parseInt(input.value, 10);
      if (!isNaN(v)) state[def.key] = clamp(v);
    });
    input.addEventListener('blur', () => {
      const v = clamp(parseInt(input.value, 10) || def.min);
      input.value = v; state[def.key] = v;
    });
    wrap.appendChild(minusBtn); wrap.appendChild(input); wrap.appendChild(plusBtn);
    body.appendChild(wrap);
    if (def.unit) body.appendChild(el('div', 'input-hint', def.unit));
    return body;
  }
  if (def.type === 'select'){
    const dropdown = buildCustomSelect(def.options, state[def.key], (val) => {
      state[def.key] = val;
    });
    body.appendChild(dropdown);
    return body;
  }
  if (def.type === 'spaceMode'){
    const randomWrap = el('div', 'conditional-reveal');
    randomWrap.style.display = state.spaceMode === 'random' ? 'block' : 'none';
    const randomInput = document.createElement('input');
    randomInput.type = 'number'; randomInput.className = 'nice-input';
    randomInput.min = 1; randomInput.max = 10; randomInput.value = state.spaceCount;
    randomInput.addEventListener('input', () => {
      state.spaceCount = Math.max(1, Math.min(10, parseInt(randomInput.value, 10) || 1));
    });
    randomWrap.appendChild(randomInput);
    randomWrap.appendChild(el('div', 'input-hint', '// spaces to insert at random offsets'));

    const patternWrap = el('div', 'conditional-reveal');
    patternWrap.style.display = state.spaceMode === 'pattern' ? 'block' : 'none';
    const patternInput = document.createElement('input');
    patternInput.type = 'number'; patternInput.className = 'nice-input';
    patternInput.min = 1; patternInput.max = 20; patternInput.value = state.spaceEvery;
    patternInput.addEventListener('input', () => {
      state.spaceEvery = Math.max(1, Math.min(20, parseInt(patternInput.value, 10) || 1));
    });
    patternWrap.appendChild(patternInput);
    patternWrap.appendChild(el('div', 'input-hint', '// insert space every N characters'));

    const customWrap = el('div', 'conditional-reveal');
    customWrap.style.display = state.spaceMode === 'custom' ? 'block' : 'none';
    const customInput = document.createElement('input');
    customInput.type = 'text'; customInput.className = 'nice-input';
    customInput.placeholder = '2,5,8'; customInput.value = state.customSpaces;
    customInput.spellcheck = false; customInput.autocomplete = 'off';
    customInput.addEventListener('input', () => {
      state.customSpaces = sanitize(customInput.value);
    });
    customWrap.appendChild(customInput);
    customWrap.appendChild(el('div', 'input-hint',
      '// comma-separated positions · <code>0</code> = start · <code>2</code> = after 2nd char'
    ));

    const dropdown = buildCustomSelect(def.options, state.spaceMode, (val) => {
      state.spaceMode = val;
      randomWrap.style.display  = val === 'random'  ? 'block' : 'none';
      patternWrap.style.display = val === 'pattern' ? 'block' : 'none';
      customWrap.style.display  = val === 'custom'  ? 'block' : 'none';
    });
    body.appendChild(dropdown); body.appendChild(randomWrap);
    body.appendChild(patternWrap); body.appendChild(customWrap);
    return body;
  }
  if (def.type === 'text'){
    const input = document.createElement('input');
    input.type = 'text'; input.className = 'nice-input';
    input.placeholder = def.placeholder || '';
    input.value = state[def.key] || '';
    input.autocomplete = 'off'; input.spellcheck = false;
    input.addEventListener('input', () => { state[def.key] = sanitize(input.value); });
    body.appendChild(input);
    if (def.hint) body.appendChild(el('div', 'input-hint', def.hint));
    return body;
  }
  if (def.type === 'hotkey'){
    const hk = state[def.key];
    const btn = el('div', 'hotkey-btn',
      '<i class="fa-solid fa-circle-dot hk-icon"></i><span>' + hkLabel(hk) + '</span>'
    );
    btn.tabIndex = 0;
    const label = btn.querySelector('span');
    btn.addEventListener('focus', () => {
      btn.classList.add('rec'); label.textContent = '[ awaiting input ]';
    });
    btn.addEventListener('blur', () => {
      btn.classList.remove('rec'); label.textContent = hkLabel(state[def.key]);
    });
    btn.addEventListener('keydown', e => {
      e.preventDefault(); e.stopPropagation();
      if (['Control','Shift','Alt','Meta','OS'].includes(e.key)) return;
      if (e.code === 'Escape'){ btn.blur(); return; }
      state[def.key] = {
        ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey, win: e.metaKey, code: e.code
      };
      label.textContent = hkLabel(state[def.key]);
      btn.blur();
    });
    body.appendChild(btn);
    if (def.hint) body.appendChild(el('div', 'input-hint', def.hint));
    return body;
  }
  if (def.type === 'review'){
    const actSection = el('div', 'review-section');
    actSection.appendChild(el('div', 'review-label',
      '<i class="fa-solid fa-shield-halved"></i> directive 01 · execution policy'
    ));
    const actBlock = el('div', 'code-block');
    actBlock.textContent = ACTIVATION;
    actSection.appendChild(actBlock);
    const actRow = el('div', 'copy-row');
    const actCopy = el('button', 'action-btn',
      '<i class="fa-solid fa-copy"></i> copy directive'
    );
    actCopy.addEventListener('click', () => copyText(ACTIVATION, 'directive copied'));
    actRow.appendChild(actCopy); actSection.appendChild(actRow);
    body.appendChild(actSection);

    const scrSection = el('div', 'review-section');
    scrSection.appendChild(el('div', 'review-label',
      '<i class="fa-solid fa-code"></i> directive 02 · single-line payload'
    ));
    const scrBlock = el('div', 'code-block');
    scrBlock.textContent = buildScript();
    scrSection.appendChild(scrBlock);
    const scrRow = el('div', 'copy-row');
    const scrCopy = el('button', 'action-btn ok',
      '<i class="fa-solid fa-copy"></i> copy payload'
    );
    const scrDl = el('button', 'action-btn',
      '<i class="fa-solid fa-download"></i> export .ps1'
    );
    scrCopy.addEventListener('click', () => copyText(buildScript(), 'payload copied'));
    scrDl.addEventListener('click', downloadScript);
    scrRow.appendChild(scrCopy); scrRow.appendChild(scrDl);
    scrSection.appendChild(scrRow);
    body.appendChild(scrSection);
    body.appendChild(el('div', 'input-hint',
      '// deployment ready · continue to sandbox verification'
    ));
    return body;
  }
  if (def.type === 'test'){
    const wrap = el('div', 'test-area');
    const statusRow = el('div', 'test-status-row');
    statusRow.id = 'testStatusRow';
    statusRow.appendChild(el('span', 'status-dot'));
    const statusText = el('span', 'status-text', 'standby');
    statusText.id = 'testStatus';
    statusRow.appendChild(statusText);
    const hint = el('span', 'status-hint');
    const startK = hkLabel(state.hkStart).split(' + ').map(k => '<kbd>' + k + '</kbd>').join('+');
    hint.innerHTML = 'arm: ' + startK;
    statusRow.appendChild(hint); wrap.appendChild(statusRow);
    const field = document.createElement('input');
    field.type = 'text'; field.className = 'test-field'; field.id = 'testField';
    field.readOnly = true;
    field.placeholder = '> click here, then press your start bind';
    wrap.appendChild(field);
    const log = el('div', 'test-log'); log.id = 'testLog';
    log.appendChild(el('div', 'test-log-empty', '// waiting for input stream...'));
    wrap.appendChild(log);
    body.appendChild(wrap);
    return body;
  }
  return body;
}

function buildActions(def){
  const actions = el('div', 'card-actions');
  if (currentIndex > 0){
    const back = el('button', 'action-btn back',
      '<i class="fa-solid fa-arrow-left"></i> back'
    );
    back.addEventListener('click', goPrev);
    actions.appendChild(back);
  }
  actions.appendChild(el('div', 'spacer'));
  const okLabel =
      def.type === 'intro'  ? 'Initialize'
    : def.type === 'review' ? 'Enter Sandbox'
    : def.type === 'test'   ? 'Restart Sequence'
    :                         'Confirm';
  const okIcon =
      def.type === 'intro'  ? 'fa-power-off'
    : def.type === 'review' ? 'fa-flask'
    : def.type === 'test'   ? 'fa-rotate-left'
    :                         'fa-check';
  const ok = el('button', 'action-btn ok',
    '<i class="fa-solid ' + okIcon + '"></i> ' + okLabel
  );
  ok.addEventListener('click', confirmAndAdvance);
  actions.appendChild(ok);
  return actions;
}

function buildCard(def){
  const card = el('div', 'card');
  card.dataset.cardId = def.id;
  const chrome = el('div', 'titlebar');
  const lights = el('div', 'traffic-lights');
  const r = el('button', 'tl tl-red'); r.setAttribute('aria-label','close');
  const y = el('button', 'tl tl-yellow'); y.setAttribute('aria-label','minimize');
  const g = el('button', 'tl tl-green'); g.setAttribute('aria-label','zoom');
  lights.appendChild(r); lights.appendChild(y); lights.appendChild(g);
  chrome.appendChild(lights);
  const title = el('div', 'titlebar-title');
  title.innerHTML =
    '<i class="fa-solid fa-terminal"></i>' +
    '<span class="path">PowerCrack — <b>~/' + def.id + '.ps1</b></span>';
  chrome.appendChild(title);
  const share = el('div', 'titlebar-share');
  share.innerHTML = '<i class="fa-solid fa-share-nodes"></i>';
  chrome.appendChild(share);
  card.appendChild(chrome);

  const content = el('div', 'terminal-content');
  const prompt = el('div', 'prompt-line');
  prompt.innerHTML =
    '<span class="user">zayan</span><span>@</span>' +
    '<span class="host">forge</span>' +
    '<span class="path">~/powercrack</span>' +
    '<span class="dollar">$</span>' +
    '<span class="cmd">./configure --module ' + def.id + '</span>';
  content.appendChild(prompt);
  const chTag = buildChapterTag(def);
  if (chTag) content.appendChild(chTag);
  content.appendChild(buildIcon(def));
  content.appendChild(el('h2', 'card-title', def.title));
  const descEl = el('p', 'card-desc');
  descEl.dataset.desc = def.desc;
  content.appendChild(descEl);
  content.appendChild(buildBody(def));
  content.appendChild(buildActions(def));
  card.appendChild(content);
  return card;
}

let currentIndex = 0;
const totalCards = cardDefs.length;
const container = document.getElementById('cardContainer');
const progressFill = document.getElementById('progressFill');

function showCard(index){
  const oldCard = container.querySelector('.card');
  if (oldCard) oldCard.remove();
  const def = cardDefs[index];
  const newCard = buildCard(def);
  container.appendChild(newCard);
  currentIndex = index;
  updateProgress();
  const descEl = newCard.querySelector('.card-desc');
  const descText = descEl.dataset.desc || '';
  if (activeTypeTimer){ clearInterval(activeTypeTimer); activeTypeTimer = null; }
  setTimeout(() => {
    if (descEl && document.body.contains(descEl)){
      typeInto(descEl, descText, 11);
    }
  }, 180);
  if (def.type === 'test') initTestCard();
  else stopTest();
}
function updateProgress(){
  progressFill.style.width = (currentIndex / (totalCards - 1)) * 100 + '%';
}
function goNext(){
  if (currentIndex < totalCards - 1) showCard(currentIndex + 1);
  else showCard(0);
}
function goPrev(){ if (currentIndex > 0) showCard(currentIndex - 1); }

function confirmAndAdvance(){
  const def = cardDefs[currentIndex];
  if (def.type === 'stepper'){
    if (def.key === 'minLen' && state.minLen > state.maxLen){
      showToast('min must be <= max', true); return;
    }
    if (def.key === 'maxLen' && state.maxLen < state.minLen){
      showToast('max must be >= min', true); return;
    }
  }
  const okBtn = document.querySelector('.action-btn.ok');
  if (okBtn){
    okBtn.disabled = true;
    okBtn.classList.add('success');
    okBtn.innerHTML = '<i class="fa-solid fa-check"></i> Confirmed';
    setTimeout(() => {
      if (def.type === 'test') showCard(0);
      else goNext();
    }, 300);
  } else { goNext(); }
}
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); goNext(); }
  if (e.key === 'ArrowLeft'){ e.preventDefault(); goPrev(); }
  if (e.key === 'Enter'){
    const ok = document.querySelector('.action-btn.ok');
    if (ok && !ok.disabled){ e.preventDefault(); ok.click(); }
  }
});

const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toastMsg');
let toastTimer = null;
function showToast(msg, isWarn){
  toastMsg.textContent = msg;
  toast.classList.toggle('warn', !!isWarn);
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}
async function copyText(text, msg){
  try {
    await navigator.clipboard.writeText(text);
    showToast(msg);
  } catch (err){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast(msg); }
    catch (e2){ showToast('copy failed', true); }
    document.body.removeChild(ta);
  }
}
function downloadScript(){
  const script = buildScript();
  const BOM = '\uFEFF';
  const blob = new Blob([BOM + script], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'powercrack.ps1';
  a.setAttribute('download', 'powercrack.ps1');
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 200);
  showToast('powercrack.ps1 exported');
}

let testRunning = false;
let testTimers = [];
let testAttemptN = 0;
function clearTestTimers(){
  testTimers.forEach(t => { clearTimeout(t); clearInterval(t); });
  testTimers = [];
}
function initTestCard(){
  const field = document.getElementById('testField');
  const log = document.getElementById('testLog');
  if (!field || !log) return;
  testRunning = false; testAttemptN = 0; clearTestTimers();
  field.value = '';
  log.innerHTML = '<div class="test-log-empty">// waiting for input stream...</div>';
  updateStatus(false);
  if (!field.dataset.bound){
    field.addEventListener('click', () => field.focus());
    field.dataset.bound = '1';
  }
}
function updateStatus(running){
  const row = document.getElementById('testStatusRow');
  const txt = document.getElementById('testStatus');
  if (!row || !txt) return;
  row.classList.toggle('running', running);
  txt.textContent = running ? 'active' : 'standby';
}
function logAttempt(s){
  const log = document.getElementById('testLog');
  if (!log) return;
  const empty = log.querySelector('.test-log-empty');
  if (empty) empty.remove();
  const line = document.createElement('div');
  line.className = 'test-log-line';
  const num = String(testAttemptN).padStart(3, '0');
  line.innerHTML = '<span class="num">#' + num + '</span>' + escapeHtml(s);
  log.appendChild(line);
  while (log.children.length > 40) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}
function startTest(){
  if (testRunning) return;
  const field = document.getElementById('testField');
  if (!field) return;
  testRunning = true; updateStatus(true);
  function tick(){
    if (!testRunning) return;
    const s = generateSample();
    field.value = '';
    let i = 0;
    const typeTimer = setInterval(() => {
      if (!testRunning){ clearInterval(typeTimer); return; }
      if (i < s.length){ field.value += s[i]; i++; }
      else {
        clearInterval(typeTimer);
        const enterTimer = setTimeout(() => {
          if (!testRunning) return;
          testAttemptN++; logAttempt(s);
          field.classList.add('enter-flash');
          const flashTimer = setTimeout(() => {
            field.classList.remove('enter-flash');
            const clearTimer = setTimeout(() => {
              if (!testRunning) return;
              field.value = ''; tick();
            }, 180);
            testTimers.push(clearTimer);
          }, 160);
          testTimers.push(flashTimer);
        }, 280);
        testTimers.push(enterTimer);
      }
    }, 38);
    testTimers.push(typeTimer);
  }
  tick();
}
function stopTest(){
  testRunning = false; clearTestTimers(); updateStatus(false);
}
function matchesHotkey(e, hk){
  if (!!hk.ctrl  !== e.ctrlKey)  return false;
  if (!!hk.shift !== e.shiftKey) return false;
  if (!!hk.alt   !== e.altKey)   return false;
  if (!!hk.win   !== e.metaKey)  return false;
  return e.code === hk.code;
}
document.addEventListener('keydown', e => {
  if (cardDefs[currentIndex].type !== 'test') return;
  if (matchesHotkey(e, state.hkStart)){ e.preventDefault(); startTest(); }
  else if (matchesHotkey(e, state.hkStop)){ e.preventDefault(); stopTest(); }
});

(function runSplash(){
  const splash = document.getElementById('splash');
  const byEl = document.getElementById('splashBy');
  const nameEl = document.getElementById('splashName');
  const mottoEl = document.getElementById('splashMotto');
  let appStarted = false;
  let splashClosed = false;
  function typeString(el, text, speed, cb){
    el.classList.add('typing');
    let i = 0;
    const timer = setInterval(() => {
      if (i >= text.length){
        clearInterval(timer); el.classList.remove('typing');
        if (cb) cb();
        return;
      }
      el.textContent += text[i++];
    }, speed);
  }
  function initAppOnce(){
    if (appStarted) return;
    appStarted = true; showCard(0);
  }
  function closeSplash(){
    if (splashClosed) return;
    splashClosed = true;
    splash.classList.add('hide');
    initAppOnce();
    setTimeout(() => { splash.style.display = 'none'; }, 850);
  }
  setTimeout(() => typeString(byEl, '// MADE BY', 55), 1400);
  setTimeout(() => typeString(nameEl, 'ZAYAN CODER', 80), 2000);
  setTimeout(() => typeString(mottoEl, 'only for the people who dare for it', 30), 3100);
  setTimeout(closeSplash, 5600);
  splash.addEventListener('click', closeSplash);
})();
